name: E2E

# Playwright specs for the UI. Deliberately NOT part of the PR gate: they are
# not wired into `ci-gate`, so they can never block a merge. They exist to
# catch drift in the frontend that the unit tests do not reach, and to stop
# the specs rotting -- before this workflow they had never run anywhere, in CI
# or in the justfile, so nothing would have told us if they broke.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC nightly, an hour after Golden Scenarios
  push:
    branches: [main]
    paths:
      - "ui/src/**"
      - "ui/tests/e2e/**"
      - "ui/playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (ui/tests/e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # Only chromium: playwright.config.ts defines no `projects`, so the specs
      # run against the default browser. Installing all three would triple the
      # download for coverage nothing asks for.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ui

      # playwright.config.ts declares a `webServer` that starts `npm run dev`
      # and waits on port 4173, so no separate serve step is needed. The specs
      # do not require the Python backend -- the app renders, and the failed
      # API calls surface as unhandled rejections rather than test failures.
      - name: Run Playwright specs
        run: npx playwright test --reporter=list
        working-directory: ui

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7
